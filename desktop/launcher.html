<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>团子 Dango</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #14171a; color: #e7eaec;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .box { width: min(420px, 90vw); padding: 8px 4px; }
      .logo { text-align: center; font-size: 40px; margin-bottom: 4px; }
      h1 { text-align: center; font-size: 20px; margin: 0 0 4px; }
      .sub { text-align: center; color: #98a0a8; font-size: 13px; margin: 0 0 24px; }
      .card {
        background: #1d2126; border: 1px solid #2e343a; border-radius: 12px;
        padding: 16px; margin-bottom: 12px;
      }
      .card h2 { font-size: 15px; margin: 0 0 4px; }
      .card p { font-size: 12.5px; color: #98a0a8; margin: 0 0 12px; line-height: 1.5; }
      button {
        width: 100%; height: 40px; border: none; border-radius: 8px; cursor: pointer;
        background: oklch(0.55 0.1 200); color: #fff; font-size: 14px; font-weight: 600;
        font-family: inherit;
      }
      button:hover { filter: brightness(1.08); }
      button:disabled { opacity: 0.6; cursor: default; }
      .join-row { display: flex; gap: 8px; }
      .join-row input {
        flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 8px;
        border: 1px solid #3b485b; background: #14171a; color: #e7eaec; font-size: 14px;
        font-family: inherit; outline: none;
      }
      .join-row input:focus { border-color: oklch(0.55 0.1 200); }
      .join-row button { width: auto; padding: 0 18px; flex-shrink: 0; }
      .err { min-height: 16px; color: oklch(0.6 0.18 25); font-size: 12.5px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">🍡</div>
      <h1>团子 Dango</h1>
      <p class="sub">局域网端到端加密聊天室</p>

      <div class="card">
        <h2>自建服务器</h2>
        <p>在这台电脑上运行服务，你就是主机；创建房间后把邀请码和本机地址发给别人。</p>
        <button id="host-btn">在本机开一个服务</button>
      </div>

      <div class="card">
        <h2>加入服务器</h2>
        <p>连到别人的主机。填对方的地址（形如 <code>192.168.1.23:3000</code> 或 <code>dango.local:3000</code>），进去后用邀请码加入房间。</p>
        <div class="join-row">
          <input id="host-input" placeholder="主机地址" autocomplete="off" />
          <button id="join-btn">加入</button>
        </div>
      </div>

      <p class="err" id="err"></p>
    </div>

    <script>
      const err = document.getElementById('err');
      const hostBtn = document.getElementById('host-btn');
      const joinBtn = document.getElementById('join-btn');
      const input = document.getElementById('host-input');

      hostBtn.addEventListener('click', async () => {
        err.textContent = '';
        hostBtn.disabled = true;
        hostBtn.textContent = '正在启动…';
        try {
          await window.dango.selfHost();
        } catch (e) {
          err.textContent = '启动失败：' + (e && e.message ? e.message : e);
          hostBtn.disabled = false;
          hostBtn.textContent = '在本机开一个服务';
        }
      });

      async function doJoin() {
        const addr = input.value.trim();
        if (!addr) { err.textContent = '请输入主机地址'; return; }
        err.textContent = '';
        joinBtn.disabled = true;
        try {
          await window.dango.join(addr);
        } catch (e) {
          err.textContent = (e && e.message ? e.message : String(e));
          joinBtn.disabled = false;
        }
      }
      joinBtn.addEventListener('click', doJoin);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });
    </script>
  </body>
</html>
